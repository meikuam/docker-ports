<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Ports Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .health-status {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .health-status.healthy {
            background: rgba(46, 204, 113, 0.3);
        }
        
        .health-status.unhealthy {
            background: rgba(231, 76, 60, 0.3);
        }
        
        .content {
            padding: 30px;
        }
        
        .container-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .container-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .container-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }
        
        .container-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .container-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d3748;
        }
        
        .container-id {
            font-size: 0.8rem;
            color: #718096;
            font-family: monospace;
            margin-left: 10px;
        }
        
        .container-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-running {
            background: rgba(72, 187, 120, 0.1);
            color: #38a169;
        }
        
        .status-exited {
            background: rgba(231, 76, 60, 0.1);
            color: #c53030;
        }
        
        .status-paused {
            background: rgba(233, 30, 99, 0.1);
            color: #d53f8c;
        }
        
        .container-image {
            font-size: 0.95rem;
            color: #4a5568;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .ports-section h3 {
            font-size: 0.9rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .port-list {
            list-style: none;
        }
        
        .port-list li {
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            color: #4a5568;
        }
        
        .port-list li:last-child {
            border-bottom: none;
        }
        
        .port-list li i {
            margin-right: 10px;
            color: #667eea;
        }
        
        .no-containers {
            text-align: center;
            padding: 40px;
            color: #718096;
        }
        
        .no-containers i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #cbd5e0;
        }
        
        .no-containers p {
            font-size: 1.1rem;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }
        
        .loading i {
            font-size: 2rem;
            margin-bottom: 10px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            text-align: center;
            padding: 40px;
            color: #c53030;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 12px;
            border: 2px solid rgba(231, 76, 60, 0.2);
        }
        
        .error-message i {
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐳 Docker Ports Manager</h1>
            <p>Monitor and manage your Docker containers</p>
            <div id="healthStatus" class="health-status unhealthy">
                <i class="fas fa-exclamation-triangle"></i> Loading status...
            </div>
        </header>
        
        <div class="content">
            <div id="loading" class="loading">
                <i class="fas fa-spinner"></i>
                <p>Loading containers...</p>
            </div>
            
            <div id="error" class="error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <p id="errorMessage">An error occurred while loading containers</p>
            </div>
            
            <div id="containerGrid" class="container-grid" style="display: none;">
            </div>
            
            <div id="noContainers" class="no-containers" style="display: none;">
                <i class="fas fa-box-open"></i>
                <p>No containers found</p>
            </div>
        </div>
    </div>

    <script>
        const healthStatus = document.getElementById('healthStatus');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const errorMessage = document.getElementById('errorMessage');
        const containerGrid = document.getElementById('containerGrid');
        const noContainers = document.getElementById('noContainers');

        // Fetch containers
        async function fetchContainers() {
            try {
                const response = await fetch('/containers');
                if (!response.ok) {
                    throw new Error('Failed to fetch containers');
                }
                const data = await response.json();
                renderContainers(data.containers);
                await fetchHealthStatus();
                loading.style.display = 'none';
                containerGrid.style.display = 'grid';
            } catch (err) {
                console.error('Error fetching containers:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                errorMessage.textContent = err.message || 'An error occurred while loading containers';
            }
        }

        // Fetch health status
        async function fetchHealthStatus() {
            try {
                const response = await fetch('/health');
                if (!response.ok) {
                    throw new Error('Health check failed');
                }
                const data = await response.json();
                healthStatus.textContent = data.docker === 'connected' ? '✓ Docker Connected' : '✕ Docker Disconnected';
                healthStatus.className = 'health-status ' + (data.docker === 'connected' ? 'healthy' : 'unhealthy');
            } catch (err) {
                healthStatus.textContent = '✕ Connection Failed';
                healthStatus.className = 'health-status unhealthy';
            }
        }

        // Render containers
        function renderContainers(containers) {
            containerGrid.innerHTML = '';
            
            if (containers.length === 0) {
                noContainers.style.display = 'block';
                return;
            }
            
            noContainers.style.display = 'none';
            
            containers.forEach(container => {
                const portHtml = container.ports.length > 0 
                    ? container.ports.map(port => `
                        <li>
                            <i class="fas fa-network-wired"></i>
                            <span>${port.container_port} → ${port.host_bindings.join(', ')}</span>
                        </li>
                    `).join('')
                    : '<li><i class="fas fa-times"></i> No ports exposed</li>';
                
                const statusClass = container.status === 'running' ? 'status-running' : 
                                   container.status === 'exited' ? 'status-exited' : 'status-paused';
                
                const cardHtml = `
                    <div class="container-card">
                        <div class="container-header">
                            <div>
                                <span class="container-name">${container.name}</span>
                                <span class="container-id">${container.id}</span>
                            </div>
                            <span class="container-status ${statusClass}">${container.status}</span>
                        </div>
                        <div class="container-image">
                            <i class="fab fa-docker"></i> ${container.image}
                        </div>
                        <div class="ports-section">
                            <h3>Ports</h3>
                            <ul class="port-list">${portHtml}</ul>
                        </div>
                    </div>
                `;
                
                containerGrid.innerHTML += cardHtml;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchContainers);
    </script>
</body>
</html>
