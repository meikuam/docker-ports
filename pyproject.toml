[tool.poetry]
name = "docker-ports-viewer"
version = "0.1.0"
description = "Web server for viewing Docker containers and their ports"
authors = ["Your Name"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
gunicorn = "^21.2.0"
pydantic = "^2.5.0"
requests = "^2.31.0"
docker = "^7.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"