[tool.poetry]
name = "docker-ports-viewer"
version = "0.1.0"
description = "Web server for viewing Docker containers and their ports"
authors = ["Your Name"]
readme = "README.md"
packages = [{include = "app", format = "sdist"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
gunicorn = "^21.2.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
requests = "^2.31.0"
docker = "^7.1.0"
python-dotenv = "^1.0.0"
jinja2 = "^3.1.6"
aiofiles = "^25.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
httpx = "^0.25.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"